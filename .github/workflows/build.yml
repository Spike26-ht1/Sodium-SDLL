name: Build Sodium-SDLL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            unzip \
            build-essential \
            cmake \
            ninja-build \
            python3

      - name: Instalar XMake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar Android NDK r28c
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Verificar toolchain
        run: |
          java -version
          sdkmanager --version
          xmake --version

          test -f \
            "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

          test -x \
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Baixar e compilar Preloader ARM64
        run: |
          git clone --depth 1 \
            https://github.com/LiteLDev/preloader-android.git \
            preloader

          cmake \
            -S preloader \
            -B preloader/build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/preloader/install"

          cmake --build \
            preloader/build \
            --parallel

          cmake --install \
            preloader/build

          mkdir -p \
            "$GITHUB_WORKSPACE/preloader/install/include"

          cp -R \
            "$GITHUB_WORKSPACE/preloader/build/_deps/fmt-src/include/fmt" \
            "$GITHUB_WORKSPACE/preloader/install/include/"

          test -f \
            "$GITHUB_WORKSPACE/preloader/install/include/fmt/format.h"

          test -f \
            "$GITHUB_WORKSPACE/preloader/install/lib/libpreloader.so"
          test -f \
            "$GITHUB_WORKSPACE/preloader/install/lib/libpreloader.so"

          test -f \
            "$GITHUB_WORKSPACE/preloader/install/include/pl/Mod.hpp"

          echo "PRELOADER_ROOT=$GITHUB_WORKSPACE/preloader/install" >> "$GITHUB_ENV"

      - name: Configurar XMake
        run: |
          xmake f -c

          xmake f \
            -p android \
            -a arm64-v8a \
            -m release \
            --ndk="$ANDROID_NDK_HOME" \
            --android_sdk="$ANDROID_HOME" \
            -y

      - name: Compilar Sodium-SDLL
        run: |
          xmake -v -y

      - name: Verificar artefatos
        run: |
          find build -type f | sort

          test -f \
            "$(find build -type f -name 'libSodiumSDLL.so' | head -n 1)"

          test -f \
            "$(find build -type f -name 'Sodium-SDLL.levipack' | head -n 1)"

      - name: Enviar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Sodium-SDLL-android-arm64
          path: |
            build/**/*.so
            build/**/*.levipack
